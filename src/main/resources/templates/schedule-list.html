<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedules | Self Scheduling System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="navbar">
    <div class="navbar-brand">📅 Self Scheduling System</div>
    <nav class="navbar-links">
        <a th:href="@{/}">Dashboard</a>
        <a th:href="@{/schedules}" class="active">Schedules</a>
        <a th:href="@{/schedules/new}">+ New Schedule</a>
    </nav>
</header>

<main class="container">

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <section class="panel">
        <div class="panel-header">
            <h2>All Schedules</h2>
        </div>

        <form th:action="@{/schedules}" method="get" class="filter-form">
            <input type="text" name="keyword" placeholder="Search by title or name" th:value="${keyword}">
            <input type="date" name="date" th:value="${date}">
            <button type="submit" class="btn btn-primary">Filter</button>
            <a th:href="@{/schedules}" class="btn btn-secondary">Clear</a>
        </form>

        <div th:if="${#lists.isEmpty(schedules)}" class="empty-state">
            No schedules found. <a th:href="@{/schedules/new}">Create one</a>.
        </div>

        <table class="schedule-table" th:unless="${#lists.isEmpty(schedules)}">
            <thead>
            <tr>
                <th>Date</th>
                <th>Time</th>
                <th>Title</th>
                <th>Name</th>
                <th>Category</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="schedule : ${schedules}">
                <td th:text="${schedule.scheduleDate}">Date</td>
                <td th:text="${schedule.startTime} + ' - ' + ${schedule.endTime}">Time</td>
                <td th:text="${schedule.title}">Title</td>
                <td th:text="${schedule.name}">Name</td>
                <td><span class="badge" th:text="${schedule.category}">Category</span></td>
                <td>
                    <span class="status-badge" th:classappend="'status-' + ${schedule.status}" th:text="${schedule.status}">Status</span>
                </td>
                <td class="actions">
                    <a th:href="@{/schedules/{id}/edit(id=${schedule.id})}" class="btn btn-small btn-secondary">Edit</a>
                    <form th:action="@{/schedules/{id}/delete(id=${schedule.id})}" method="post" onsubmit="return confirm('Cancel/delete this schedule?');">
                        <button type="submit" class="btn btn-small btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>

<footer class="footer">
    <p>Self Scheduling System &mdash; College DevOps Project</p>
</footer>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
