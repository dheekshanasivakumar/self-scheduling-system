# ==============================
# Application Info
# ==============================
spring.application.name=self-scheduling-system
server.port=8080

# ==============================
# MySQL Database Configuration
# ==============================
# Replace YOUR_PASSWORD below with your actual local MySQL root password.
# Make sure the database "self_scheduling_db" exists before running the app
# (CREATE DATABASE self_scheduling_db; in MySQL Workbench or terminal).
spring.datasource.url=jdbc:mysql://localhost:3306/self_scheduling_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Dheekshana@2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / Hibernate Configuration
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==============================
# Thymeleaf Configuration
# ==============================
spring.thymeleaf.cache=false
